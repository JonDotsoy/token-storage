services:
  oauth-dummy:
    image: oven/bun:1.3.4
    volumes:
      - .:/app
    command: ["bun", "/app/tests/"]

  db:
    image: duckdb/duckdb:latest

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  testing:
    build:
      context: .
      target: testing
    image: tokens:latest

  build:
    build:
      context: .
      target: build
    image: tokens:latest

  app:
    build: .
    image: tokens:latest
    ports:
      - 5454:5454
    volumes:
      - ./db:/data

volumes:
  postgres_data:
